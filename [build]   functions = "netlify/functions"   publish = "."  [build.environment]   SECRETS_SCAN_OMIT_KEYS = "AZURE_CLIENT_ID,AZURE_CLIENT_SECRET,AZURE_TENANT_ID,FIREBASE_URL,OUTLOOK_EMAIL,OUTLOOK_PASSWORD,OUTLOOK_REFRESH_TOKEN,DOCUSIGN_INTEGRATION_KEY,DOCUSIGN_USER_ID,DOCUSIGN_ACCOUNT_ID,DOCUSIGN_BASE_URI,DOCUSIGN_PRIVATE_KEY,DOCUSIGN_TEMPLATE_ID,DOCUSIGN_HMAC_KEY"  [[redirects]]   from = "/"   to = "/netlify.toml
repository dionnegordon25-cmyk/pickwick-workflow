[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "AZURE_CLIENT_ID,AZURE_CLIENT_SECRET,AZURE_TENANT_ID,FIREBASE_URL,OUTLOOK_EMAIL,OUTLOOK_PASSWORD,OUTLOOK_REFRESH_TOKEN,DOCUSIGN_INTEGRATION_KEY,DOCUSIGN_USER_ID,DOCUSIGN_ACCOUNT_ID,DOCUSIGN_BASE_URI,DOCUSIGN_PRIVATE_KEY,DOCUSIGN_TEMPLATE_ID,DOCUSIGN_HMAC_KEY"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
